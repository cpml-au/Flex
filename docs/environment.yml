# copy from environment.yaml in project root
name: readthedocs
channels:
  - conda-forge
dependencies:
  - gmsh
  - jax==0.5.0
  - jaxopt
  - numpy
  - numba
  # Required by dctkit.math.opt.optctrl.
  - pygmo
  - python==3.12
  - python-gmsh
  - trame
  - ipywidgets
  - scipy
  - scikit-learn
  - pyvista
  - typeguard
  - yaml
  # Required by dctkit.math.opt.optctrl, including when using the pygmo solver.
  - petsc4py
  - pip
  - pip:
      - nbsphinx
      - sphinx-rtd-theme
      - myst-parser[linkify]
      - sphinx>=3.2.1
      - git+https://github.com/cpml-au/dctkit
      - git+https://github.com/cpml-au/deap@da724f1a9b405bfde12060b85a889c0d18d80d5d
      - "ray[default]"
      - pygmsh
      - tox
      - tox-conda
      - pmlb
      - optuna
      - optuna-integration
      - sympy
