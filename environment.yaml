name: flex
channels:
  - conda-forge
  - defaults
dependencies:
  - gmsh
  - jax==0.5.0
  - jaxopt
  - numpy
  - pygmo
  - python==3.12
  - python-gmsh
  - trame
  - ipywidgets
  - scipy
  - scikit-learn
  - pyvista
  - typeguard
  - yaml
  - pygraphviz
  # Required by dctkit.math.opt.optctrl, including when using the pygmo solver.
  - petsc4py
  - pip
  - pip:
      - git+https://github.com/cpml-au/dctkit
      - git+https://github.com/cpml-au/deap@fa0b033ec6e242a59dc8a8f01ab51b36ff00af89
      - "ray[default]"
      - pygmsh
      - tox
      - mygrad
      - tox-conda
      - pmlb
      - optuna
      - optuna-integration
      - sympy
