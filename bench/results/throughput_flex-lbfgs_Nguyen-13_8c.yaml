gp:
  num_individuals: 500
  generations: 220
  multi_island:
    num_islands: 5
    migration:
      freq: 5
      frac: 0.1
  crossover_prob: 1.0
  mut_prob: 0.5
  variation_mechanism: varAnd
  frac_elitist: 0.0
  min_: 2
  max_: 6
  overlapping_generation: true
  validate: false
  penalty:
    reg_param: 5.0e-05
    age_reg_param: 0.0001
  select:
    fun: tools.selection.selStochasticUniversalSampling
    kargs: '{''k'': self.num_individuals, ''weight_transform'': lambda loss: 1.0 /
      (1.0 + loss)}'
  mutate:
    fun: gp.mixedMutate
    kargs: '{''expr'': toolbox.expr_mut, ''pset'': pset, ''prob'': [0.7, 0.2, 0.1]}'
    expr_mut: gp.genHalfAndHalf
    expr_mut_kargs: '{''min_'': 1, ''max_'': 2}'
  crossover:
    fun: gp.cxOnePoint
    kargs: '{}'
  scaleXy: false
  tarpeian_length_threshold: 40
  final_model_selection: mse
  batch_size: 200
  use_constants: true
  const_optimizer: lbfgs
  remove_init_duplicates: false
  primitives:
    imports:
      flex.gp.numpy_primitives:
      - numpy_primitives
    used:
    - name: add
      dimension: null
      rank: null
    - name: sub
      dimension: null
      rank: null
    - name: mul
      dimension: null
      rank: null
    - name: div
      dimension: null
      rank: null
    - name: sin
      dimension: null
      rank: null
    - name: cos
      dimension: null
      rank: null
    - name: exp
      dimension: null
      rank: null
    - name: log
      dimension: null
      rank: null
