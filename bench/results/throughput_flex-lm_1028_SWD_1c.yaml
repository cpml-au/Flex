gp:
  num_individuals: 1000
  generations: 70
  multi_island:
    num_islands: 5
    migration:
      freq: 10
      frac: 0.05
  crossover_prob: 0.0
  mut_prob: 1.0
  frac_elitist: 0.0
  min_: 2
  max_: 4
  overlapping_generation: true
  validate: false
  penalty:
    reg_param: 0.001
  select:
    fun: random.sample
    kargs: '{''k'': self.num_individuals}'
  mutate:
    fun: gp.mixedMutate
    kargs: '{''expr'': toolbox.expr_mut, ''pset'': pset, ''prob'': [0.7, 0.2, 0.1]}'
    expr_mut: gp.genHalfAndHalf
    expr_mut_kargs: '{''min_'': 1, ''max_'': 2}'
  crossover:
    fun: gp.cxOnePoint
    kargs: '{}'
  scaleXy: true
  batch_size: 10
  use_constants: true
  const_optimizer: lm
  primitives:
    imports:
      flex.gp.numpy_primitives:
      - numpy_primitives
    used:
    - name: add
      dimension: null
      rank: null
    - name: sub
      dimension: null
      rank: null
    - name: mul
      dimension: null
      rank: null
    - name: aq
      dimension: null
      rank: null
    - name: sin
      dimension: null
      rank: null
